[theme]
base = "light"
primaryColor = "#0b6e4f"
backgroundColor = "#f7faf8"
secondaryBackgroundColor = "#ffffff"
textColor = "#172b24"
linkColor = "#075b42"
borderColor = "#c9d8d0"
font = "sans-serif"
headingFont = "sans-serif"
baseRadius = "medium"
buttonRadius = "medium"
showSidebarBorder = true
paddingTop = "1.5rem"
paddingBottom = "2rem"

[theme.sidebar]
backgroundColor = "#edf5f0"
