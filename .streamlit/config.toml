[theme]
font = "sans-serif"
headingFont = "sans-serif"
baseRadius = "medium"
buttonRadius = "medium"
showSidebarBorder = true

[theme.light]
primaryColor = "#2f7d5c"
backgroundColor = "#f1faf4"
secondaryBackgroundColor = "#ffffff"
textColor = "#163326"
linkColor = "#246b4d"
borderColor = "#b9dbc6"
greenColor = "#77c69b"

[theme.light.sidebar]
backgroundColor = "#e2f3e8"
secondaryBackgroundColor = "#ffffff"
textColor = "#163326"
primaryColor = "#2f7d5c"
linkColor = "#246b4d"
borderColor = "#b9dbc6"
codeBackgroundColor = "#ffffff"
codeTextColor = "#172b24"

[theme.dark]
primaryColor = "#72c798"
backgroundColor = "#102d21"
secondaryBackgroundColor = "#1b4231"
textColor = "#edf9f1"
linkColor = "#a7edc4"
borderColor = "#3a7658"
greenColor = "#83d9a8"
blueColor = "#7dc9df"
violetColor = "#baa9e8"

[theme.dark.sidebar]
backgroundColor = "#164432"
secondaryBackgroundColor = "#215840"
textColor = "#edf9f1"
primaryColor = "#8cddb0"
linkColor = "#b7f2ce"
borderColor = "#4c896a"
codeBackgroundColor = "#215840"
codeTextColor = "#edf9f1"
